name: build-test

# Builds the gem through a host O3DE project and runs its unit tests.
#
# This needs the full O3DE 26.05 SDK, a host project, and 3rdParty packages.
# Both legs are opt-in: triggered manually, or on PRs that a maintainer has
# labelled, so ordinary contributors are never blocked.
#
# Two legs, with different homes:
#
# Linux (`ci:build-linux` label, or dispatch leg=linux/both) runs on a
# GitHub-hosted runner INSIDE a `container:` (ci/Containerfile: Fedora 44 + the
# O3DE SDK, published to ghcr.io by ci-image.yml). Untrusted PR code therefore
# runs on GitHub's throwaway VMs, never on local hardware, and needs no
# self-hosted runner. The image's glibc/3rdParty match the SDK exactly (a stock
# Ubuntu runner cannot even load AzTestRunner).
#
# Windows (`ci:build` label, or a manual dispatch, which defaults to `windows`)
# is the active gate on a self-hosted runner labelled `o3de` + `windows`
# (ci_build_test.ps1): O3DE's primary platform, and headless GPU work needs the
# real hardware. A job whose `if` is true but whose `runs-on` labels match no
# online runner does NOT skip, it queues until one appears; the distinct labels
# keep an ordinary `ci:build` from leaving a job hung with no runner.
#
# The lint workflow (lint.yml) remains the always-on gate on GitHub-hosted
# runners; this one is the heavier, environment-dependent complement.

on:
  workflow_dispatch:
    inputs:
      leg:
        description: Which OS leg(s) to run on a manual dispatch
        type: choice
        options: [both, linux, windows]
        # Default to windows: it is the active gate. The Linux leg runs on a
        # GitHub-hosted container and is available any time via linux/both.
        default: windows
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

jobs:
  build-test-linux:
    name: build and unit test (Linux)
    # Opt-in via the DISTINCT `ci:build-linux` label (not the general `ci:build`,
    # which fires Windows only). Runs on a GitHub-hosted runner inside the
    # ci-fedora container, so the SDK is present and untrusted PR code never
    # touches local hardware.
    if: >
      (github.event_name == 'workflow_dispatch' && (inputs.leg == 'both' || inputs.leg == 'linux')) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:build-linux'))
    runs-on: ubuntu-latest
    container:
      # Fedora 44 + O3DE SDK, published by ci-image.yml. Credentials let the job
      # pull it while the repo/package is private; once the package is made
      # public they become unnecessary (and fork PRs can pull it too).
      image: ghcr.io/${{ github.repository }}/ci-fedora:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Build and test
        # Engine and host project are baked into the container image at fixed
        # paths; GEM_PATH defaults to this checkout.
        env:
          O3DE_ENGINE_PATH: /opt/O3DE/26.05.0
          DIORAMA_PROJECT: /opt/diorama-host
          BUILD_CONFIG: profile
          # Run the whole suite: the tests are sub-second (the build is the cost),
          # so the gate exercises every Diorama test, not a subset.
          TEST_FILTER: "*"
        run: ./scripts/ci_build_test.sh

  build-test-windows:
    name: build and unit test (Windows)
    # Gated identically to the Linux leg. Requires a self-hosted Windows runner
    # labelled `o3de` + `windows` with the O3DE SDK and a host project; until one
    # is online this job is simply queued/skipped and never blocks a PR. Windows
    # is O3DE's primary platform, so this confirms the gem builds and tests there.
    if: >
      (github.event_name == 'workflow_dispatch' && (inputs.leg == 'both' || inputs.leg == 'windows')) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:build'))
    runs-on: [self-hosted, o3de, windows]
    steps:
      - uses: actions/checkout@v6

      - name: Show environment
        # Print only whether the config is present, not the paths/host, so public
        # logs on this public repo do not advertise local environment details.
        shell: pwsh
        run: |
          Write-Host "engine : $(if ($env:O3DE_ENGINE_PATH) {'set'} else {'<unset>'})"
          Write-Host "project: $(if ($env:DIORAMA_PROJECT) {'set'} else {'<unset>'})"

      - name: Build and test
        # Variables can be Windows-specific (e.g. an O3DE_ENGINE_PATH_WINDOWS)
        # if the Linux and Windows runners share the repo; fall back to the
        # common ones otherwise.
        shell: pwsh
        env:
          O3DE_ENGINE_PATH: ${{ vars.O3DE_ENGINE_PATH_WINDOWS || vars.O3DE_ENGINE_PATH }}
          DIORAMA_PROJECT: ${{ vars.DIORAMA_PROJECT_WINDOWS || vars.DIORAMA_PROJECT }}
          BUILD_CONFIG: profile
          # Run the whole suite: the tests are sub-second (the build is the cost),
          # so the gate exercises every Diorama test, not a subset.
          TEST_FILTER: "*"
        run: .\scripts\ci_build_test.ps1
